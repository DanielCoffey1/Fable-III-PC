name: Build and publish Albion Reborn
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      validate_only:
        description: Build and test without publishing
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: albion-release-agent
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'DanielCoffey1/Fable-III-PC' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, albion-release]
    timeout-minutes: 180
    steps:
      - name: Build trusted main revisions and publish tested packages
        shell: powershell
        env:
          VALIDATE_ONLY: ${{ inputs.validate_only }}
        run: |
          $ErrorActionPreference='Stop'
          $config=Get-Content -LiteralPath $env:ALBION_AGENT_CONFIG -Raw | ConvertFrom-Json
          $launcher=Join-Path $config.root 'repos\Albion-Reborn'
          if(@(git -C $launcher status --porcelain --untracked-files=no).Count){throw 'Agent launcher checkout has tracked changes.'}
          git -C $launcher fetch origin main
          if($LASTEXITCODE){throw 'Launcher fetch failed.'}
          git -C $launcher merge --ff-only origin/main
          if($LASTEXITCODE){throw 'Launcher fast-forward failed.'}
          $arguments=@{ConfigPath=$env:ALBION_AGENT_CONFIG}
          if($env:VALIDATE_ONLY -eq 'true'){$arguments.ValidateOnly=$true}
          & (Join-Path $launcher 'tools\Invoke-AutomatedRelease.ps1') @arguments
